name: Static Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate the reproducible sample analysis
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-runtime.lock.txt
          python run_all.py --mode sample
      - name: Build static site
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run size
      - name: Upload only the built static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4

  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live site smoke test (Q9)
        shell: bash
        run: |
          base="https://lily09-project.github.io/market-anomaly-dashboard"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$base/" | grep -q "Market Regime Lab"; then break; fi
            sleep 20
          done
          curl --fail --silent --show-error "$base/" | grep -q "Market Regime Lab"
          curl --fail --silent --show-error "$base/data/manifest.json" | grep -q '"schema_version":"2.0"'

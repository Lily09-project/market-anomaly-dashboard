name: Static Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 22:30 Taipei: TWSE margin balances (MI_MARGN, undated) are posted in the evening.
    - cron: "30 14 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-runtime.lock.txt
      - name: Generate reproducible fixtures for pull request preview
        if: github.event_name == 'pull_request'
        run: python run_all.py --mode sample
      - name: Fetch public historical prices for production snapshot
        if: github.event_name != 'pull_request'
        run: python run_all.py --mode api --require-api
      - name: Build static site
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm run size
      - name: Install Chromium for live public-data acceptance
        if: github.event_name != 'pull_request'
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Verify live public-data user paths before deployment
        if: github.event_name != 'pull_request'
        working-directory: web
        env:
          CI: "1"
        run: npm run e2e -- e2e/production-data.spec.ts
      - name: Record the deployed source and asset digests
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("web/dist")
          files = [root / "index.html", *sorted((root / "assets").glob("*.js")), *sorted((root / "assets").glob("*.css"))]
          assert len(files) > 1 and all(path.is_file() for path in files)
          payload = {
              "source_sha": os.environ["GITHUB_SHA"],
              "files": {path.relative_to(root).as_posix(): hashlib.sha256(path.read_bytes()).hexdigest() for path in files},
          }
          (root / "deployment.json").write_text(json.dumps(payload, sort_keys=True) + "\n", encoding="utf-8")
          PY
      - name: Upload only the built static site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v4

  smoke:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Live site smoke test (Q9)
        shell: bash
        run: |
          base="https://lily09-project.github.io/market-anomaly-dashboard"
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error "$base/" | grep -q "Market Regime Lab"; then break; fi
            sleep 20
          done
          curl --fail --silent --show-error "$base/" | grep -q "Market Regime Lab"
          curl --fail --silent --show-error "$base/data/manifest.json" | grep -q '"schema_version":"2.1"'
          curl --fail --silent --show-error "$base/data/provenance.json" --output "$RUNNER_TEMP/provenance.json"
          python - "$RUNNER_TEMP/provenance.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          provenance = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          quality = provenance.get("source_quality")
          assert provenance.get("provider") == "finmind"
          assert provenance.get("data_source") == "FinMind public historical daily prices"
          assert provenance.get("is_simulated") is False
          assert isinstance(quality, dict)
          usable = quality.get("usable_price_rows")
          source = quality.get("source_row_count")
          excluded = quality.get("excluded_no_trade_rows")
          assert isinstance(usable, int) and not isinstance(usable, bool) and usable > 0
          assert isinstance(source, int) and not isinstance(source, bool)
          assert isinstance(excluded, int) and not isinstance(excluded, bool) and excluded >= 0
          assert source == usable + excluded
          print(f"Verified public FinMind snapshot: {usable} usable, {excluded} no-trade rows excluded")
          PY
      - name: Verify the public source revision and assets
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import time
          import urllib.request

          base = "https://lily09-project.github.io/market-anomaly-dashboard/"
          expected = os.environ["EXPECTED_SHA"]
          for attempt in range(6):
              try:
                  def fetch(path):
                      with urllib.request.urlopen(base + path + "?revision=" + expected, timeout=30) as response:
                          return response.read()
                  deployed = json.loads(fetch("deployment.json"))
                  assert deployed["source_sha"] == expected, "Public source revision does not match this deployment"
                  assert "index.html" in deployed["files"] and len(deployed["files"]) > 1
                  for path, digest in deployed["files"].items():
                      assert path == "index.html" or (path.startswith("assets/") and ".." not in path and path.endswith((".js", ".css"))), path
                      assert hashlib.sha256(fetch(path)).hexdigest() == digest, "Public asset mismatch: " + path
                  print("Verified public source revision and asset digests:", expected)
                  break
              except Exception:
                  if attempt == 5:
                      raise
                  time.sleep(20)
          PY

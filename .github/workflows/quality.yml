name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PIP_DEFAULT_TIMEOUT: "60"
  PIP_RETRIES: "10"

jobs:
  python:
    name: Python pipeline and analytics
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-dev.lock.txt
          python -m pip check
      - name: Verify public release boundaries
        run: python scripts/verify_release.py
      - name: Compile Python sources
        run: python -m compileall -q run_all.py src scripts tests
      - name: Run tests with analytics coverage gate (Q1 ≥ 90%)
        shell: bash
        run: |
          set -o pipefail
          python -W error -m pytest -q --color=no --tb=short \
            --cov=src.analytics --cov=src.export_web --cov-report=term-missing --cov-fail-under=90 2>&1 | tee pytest.log
      - name: Surface the pytest failure as an annotation
        if: failure()
        shell: python
        run: |
          from pathlib import Path
          log = Path("pytest.log")
          tail = log.read_text(encoding="utf-8", errors="replace").splitlines()[-80:] if log.exists() else ["pytest.log missing"]
          body = "%0A".join(line.replace("%", "%25") for line in tail)
          print(f"::error title=pytest failed::{body}")
      - name: Prove the pipeline and export are reproducible (Q7)
        shell: bash
        run: |
          python -c "from pathlib import Path; from run_all import run; run('sample', Path('${RUNNER_TEMP}/export-a'))"
          python -c "from pathlib import Path; from run_all import run; run('sample', Path('${RUNNER_TEMP}/export-b'))"
          diff -r "${RUNNER_TEMP}/export-a" "${RUNNER_TEMP}/export-b"
          cat "${RUNNER_TEMP}/export-a/manifest.json"

  web:
    name: Web app (types, lint, unit, build, budget, E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Generate data and export it for the web app
        working-directory: .
        run: |
          python -m pip install --upgrade "pip>=26.2"
          python -m pip install -r requirements-runtime.lock.txt
          python run_all.py --mode sample
      - name: Install locked web dependencies
        run: npm ci --no-audit --no-fund
      - name: Type check (Q2)
        run: npm run typecheck
      - name: Lint (Q2)
        run: npm run lint
      - name: Unit tests with coverage gate (Q3 ≥ 85%)
        run: npm run coverage
      - name: Build
        run: npm run build
      - name: Performance budget (Q6)
        run: npm run size
      - name: Install Chromium for E2E
        run: npx playwright install --with-deps chromium
      - name: End-to-end journeys, accessibility and security (Q4, Q5, Q8)
        env:
          CI: "1"
        run: npm run e2e
      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          if-no-files-found: ignore
          retention-days: 7

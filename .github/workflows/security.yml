name: Quality & Security

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and audit tools
        run: |
          python -m pip install "pip>=26.2"
          python -m pip install --requirement requirements-dev.lock.txt

      - name: Run release gate
        run: |
          python -m compileall -q run_all.py src scripts tests
          python scripts/verify_release.py

      - name: Scan Python source
        run: python -m bandit -r run_all.py src scripts --exclude tests

      - name: Run Ruff correctness gate
        run: python -m ruff check run_all.py src scripts tests

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build production image
        run: docker build --tag market-regime-lab:ci .

      - name: Verify container health and security headers
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 8080:8080 market-regime-lab:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/healthz | grep --quiet ok; then
              curl --fail --silent --show-error http://127.0.0.1:8080/ | grep --quiet "Market Regime Lab"
              curl --fail --silent --show-error http://127.0.0.1:8080/data/manifest.json | grep --quiet '"schema_version":"2.1"'
              curl --fail --silent --show-error http://127.0.0.1:8080/data/provenance.json --output "$RUNNER_TEMP/provenance.json"
              python - "$RUNNER_TEMP/provenance.json" <<'PY'
              import json
              import sys
              from pathlib import Path

              provenance = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
              assert provenance.get("provider") == "finmind"
              assert provenance.get("data_source") == "FinMind public historical daily prices"
              assert provenance.get("is_simulated") is False
              assert provenance.get("input_sha256")
              print("Verified source-backed FinMind data in production container")
              PY
              curl --silent --head http://127.0.0.1:8080/ | grep --quiet --ignore-case "content-security-policy"
              test "$(docker inspect --format '{{.Config.User}}' "$container_id")" = "101"
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

  web-dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: Audit locked web dependencies
        working-directory: web
        run: npm audit --audit-level=high

  # Independent and mandatory: audit failure must not hide source validation.
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and audit tools
        run: |
          python -m pip install "pip>=26.2"
          python -m pip install --requirement requirements-dev.lock.txt

      - name: Audit dependencies
        run: python -m pip_audit --strict --progress-spinner off

name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and audit tools
        run: |
          python -m pip install "pip>=26.2"
          python -m pip install --requirement requirements-dev.lock

      - name: Run release gate
        run: |
          python -m compileall -q app.py src scripts tests
          python scripts/verify_release.py

      - name: Audit dependencies
        run: python -m pip_audit --strict --progress-spinner off

      - name: Scan Python source
        run: python -m bandit -r app.py src scripts --exclude tests

      - name: Run tests
        run: python -W error -m pytest -q -p no:cacheprovider
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build production image
        run: docker build --tag research-trust-workbench:ci .

      - name: Verify container health
        shell: bash
        run: |
          container_id="$(docker run --detach --publish 8765:8765 research-trust-workbench:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health | grep --quiet ok; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$container_id"
          exit 1

  browser-ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MARKET_DASHBOARD_OFFLINE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install browser QA dependencies
        run: python -m pip install --requirement requirements-e2e.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Prepare deterministic demo data
        run: python run_all.py --mode sample

      - name: Start Streamlit
        shell: bash
        run: |
          nohup python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8765 > streamlit-ui-qa.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8765/_stcore/health | grep --quiet ok; then
              exit 0
            fi
            sleep 2
          done
          cat streamlit-ui-qa.log
          exit 1

      - name: Run responsive browser QA
        run: python scripts/ui_qa.py --url http://127.0.0.1:8765

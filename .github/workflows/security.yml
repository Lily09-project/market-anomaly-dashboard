name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and audit tools
        run: python -m pip install -r requirements.txt pip-audit bandit

      - name: Audit dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Scan Python source
        run: python -m bandit -r app.py src --exclude tests

      - name: Run tests
        run: python -W error::ResourceWarning -m pytest -q -p no:cacheprovider
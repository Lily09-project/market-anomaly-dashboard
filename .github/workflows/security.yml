name: Security checks

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "17 19 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install project and audit tools
        run: python -m pip install -r requirements.txt pip-audit bandit pytest-github-actions-annotate-failures

      - name: Audit dependencies
        run: python -m pip_audit --progress-spinner off

      - name: Scan Python source
        run: python -m bandit -r app.py src --exclude tests

      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider
